<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Track your monthly income and expenses, fully offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Money Book" />
    <title>Money Book</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 id="view-title">Money Book</h1>
      <div class="month-switch" id="month-switch">
        <button class="icon-btn" id="prev-month" aria-label="Previous month">&#8249;</button>
        <span id="month-label"></span>
        <button class="icon-btn" id="next-month" aria-label="Next month">&#8250;</button>
      </div>
    </header>

    <div id="reminder-banner" class="banner" hidden>
      <span>You haven't logged anything today.</span>
      <button class="link-btn" id="reminder-add">Add now</button>
    </div>

    <main>
      <section id="view-home" class="view"></section>
      <section id="view-list" class="view" hidden></section>
      <section id="view-budgets" class="view" hidden></section>
      <section id="view-reports" class="view" hidden></section>
      <section id="view-more" class="view" hidden></section>
    </main>

    <button class="fab" id="fab" aria-label="Add transaction">+</button>

    <nav class="bottom-nav">
      <button data-action="nav" data-view="home" class="active"><span class="nav-ico">&#8962;</span>Home</button>
      <button data-action="nav" data-view="list"><span class="nav-ico">&#9776;</span>Entries</button>
      <button data-action="nav" data-view="budgets"><span class="nav-ico">&#9681;</span>Budgets</button>
      <button data-action="nav" data-view="reports"><span class="nav-ico">&#9636;</span>Reports</button>
      <button data-action="nav" data-view="more"><span class="nav-ico">&#8943;</span>More</button>
    </nav>

    <dialog id="sheet" class="sheet">
      <div id="sheet-body"></div>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
